[package]
name = "crabslab2-macros"
version = "0.1.0"
edition = "2024"
description = "Proc-macros for crabslab2: #[slab_module] and #[slab_item]"
repository = "https://github.com/schell/crabslab"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "^1.0"
quote = "^1.0"
syn = { version = "^2.0", features = ["full", "extra-traits", "parsing"] }
