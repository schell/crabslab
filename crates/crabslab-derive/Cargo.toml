[package]
name = "crabslab-derive"
version = "0.7.0"
edition = "2021"
description = "Slab implementation focused on marshalling data between CPUs and GPUs"
repository = "https://github.com/schell/crabslab"
license = "MIT OR Apache-2.0"
keywords = ["game", "graphics", "shader", "rendering"]
categories = ["rendering", "game-development", "graphics"]
readme = "../../README.md"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true
bench = false

[dependencies]
proc-macro2 = "^1.0"
proc-macro-crate = { workspace = true }
quote = "^1.0"
syn = { version = "^2.0", features = ["extra-traits", "parsing"] }

[dev-dependencies]
crabslab = {path = "../crabslab"}
