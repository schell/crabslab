[package]
name = "craballoc"
version = "0.5.0"
edition = "2021"
description = "Slab allocator with RAII, for synchronizing values between CPU and GPU"
repository = "https://github.com/schell/crabslab"
license = "MIT OR Apache-2.0"
keywords = ["gpu", "shader", "wgsl", "slab", "allocator"]
categories = ["rendering", "game-development", "graphics"]
readme = "README.md"

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu"]

[dependencies]
async-channel.workspace = true
bytemuck.workspace = true
crabslab = { path = "../crabslab", version = "0.7.0" }
log.workspace = true
rustc-hash.workspace = true
snafu.workspace = true
tracing.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
craballoc-test-shaders = { path = "../craballoc-test-shaders" }
craballoc-test-wire-types = { path = "../craballoc-test-wire-types" }
env_logger.workspace = true
futures-lite.workspace = true
glam.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
wgsl-rs-linkage-wgpu = { workspace = true, default-features = false, features = ["v29"] }
wgsl-rs.workspace = true
