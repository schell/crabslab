[workspace]
members = [
    "crates/craballoc",
    "crates/crabslab",
    "crates/crabslab-macros",
]

resolver = "2"

[workspace.dependencies]
async-channel = "1.8"
bytemuck = { version = "1.13.0", features = ["derive"] }
env_logger = "0.11"
futures-lite = { version = "1.13" }
glam = { version = "0.30.8", default-features = false }
log = "0.4"
pretty_assertions = "1.4.1"
proptest = "1.9.0"
rustc-hash = "1.1"
snafu = "0.8"
tracing = "0.1.41"
wgpu = { version = "28.0.0" }
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", subdirectory = "crates/wgsl-rs" }
