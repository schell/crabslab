[workspace]
members = [
    "crates/craballoc",
    "crates/craballoc-test-shaders",
    "crates/craballoc-test-wire-types",
    "crates/crabslab",
    "crates/crabslab-derive",
    "crates/crabslab-test-renamed",
    "crates/crabslab-test-two-versions",
]

resolver = "2"

[workspace.dependencies]
async-channel = "1.8"
bytemuck = { version = "1.13.0", features = ["derive"] }
env_logger = "0.11"
futures-lite = { version = "1.13" }
glam = { version = "0.30.8", default-features = false }
log = "0.4"
proc-macro-crate = "3"
pretty_assertions = "1.4.1"
proptest = "1.9.0"
rustc-hash = "1.1"
snafu = "0.8"
tracing = "0.1.41"
wgpu = "29"
wgsl-rs = { path = "/Users/schell/code/wgsl-rs/fix-inherent-impl-self-and-turbofish/crates/wgsl-rs" }# git = "https://github.com/schell/wgsl-rs" }
wgsl-rs-linkage-wgpu = {  path = "/Users/schell/code/wgsl-rs/fix-inherent-impl-self-and-turbofish/crates/wgsl-rs-linkage-wgpu" }#git = "https://github.com/schell/wgsl-rs" }

