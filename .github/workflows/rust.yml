name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install linux deps 
      if: runner.os == 'Linux'
      run: |
          sudo apt-get -y update
          sudo apt-get -y install mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
    - name: Install cargo-nextest
      run: cargo install --locked cargo-nextest || true
    - name: Test 
      run: cargo nextest run -j 1
      env: 
        RUST_BACKTRACE: 1

  build-macos:

    # macOS runners provide a real GPU (Metal), so the wgpu tests and the
    # doctests (including the README examples, which are include_str!ed as
    # crate docs) actually execute.
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Test
      run: cargo test -- --test-threads=1
      env:
        RUST_BACKTRACE: 1
